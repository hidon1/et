name: Restore hero tweaks

on:
  push:
    paths:
      - '.github/workflows/restore-hero-tweaks.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested hero changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('font-size: clamp(4.2rem, 9vw, 7.5rem);', 'font-size: clamp(5.2rem, 11vw, 9rem);', 1)
          s = s.replace('<h1><span class="hero-title-line">ארבעת המינים</span><span class="hero-title-accent">כמו שבאמת רציתם.</span></h1>', '<h1><span class="hero-title-line">שוק ארבעת המינים</span><span class="hero-title-accent">כמו שבאמת רציתם.</span></h1>', 1)
          s = s.replace('<a href="#shop-section" class="hero-purchase-badge" aria-label="נרתיק מתנה"><i class="fa-solid fa-gift"></i><span>נרתיק<br>מתנה</span></a>', '<a href="#shop-section" class="hero-purchase-badge" aria-label="למוצרים"><i class="fa-solid fa-store"></i><span>למוצרים</span></a>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore storefront and keep requested hero tweaks"
          git push
