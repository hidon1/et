name: One-time design refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/design-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply responsive visual refresh
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* DESIGN-REFRESH-2026 */'
          if marker not in text:
              css = r'''

        /* DESIGN-REFRESH-2026 */
        :root {
            --radius-lg: 28px;
            --radius-md: 20px;
            --surface-glass: rgba(255,255,255,.82);
            --line-soft: rgba(18,53,36,.10);
        }

        html { scroll-padding-top: 92px; }

        .container {
            width: min(92%, 1200px);
        }

        header {
            box-shadow: 0 10px 35px rgba(5,24,15,.16);
        }

        .nav-container {
            min-height: 76px;
            padding-block: 10px;
        }

        .cart-icon-btn,
        .hamburger {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,241,184,.16);
        }

        .hamburger { display: none; }

        .hero {
            min-height: 720px;
            height: min(88vh, 880px);
            padding-top: 96px;
        }

        .hero-background-one {
            background-image:
                linear-gradient(120deg, rgba(7,31,19,.92), rgba(18,53,36,.84), rgba(118,91,20,.28), rgba(7,31,19,.91)),
                url('1.png');
        }

        .hero-background-two {
            background-image:
                linear-gradient(120deg, rgba(7,31,19,.91), rgba(20,58,39,.82), rgba(122,93,19,.25), rgba(7,31,19,.93)),
                url('2.png');
        }

        .hero::before {
            background:
                linear-gradient(180deg, rgba(3,18,11,.12), rgba(3,18,11,.34)),
                radial-gradient(circle at 18% 24%, rgba(255,241,184,.22) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 34%, rgba(255,255,255,.18) 0 1px, transparent 3px),
                radial-gradient(circle at 72% 80%, rgba(212,175,55,.18), transparent 24%);
            background-size: auto, 110px 110px, 84px 84px, auto;
        }

        .hero-content {
            max-width: 900px;
            padding: clamp(20px, 3vw, 34px);
            border-radius: 34px;
            background: linear-gradient(180deg, rgba(6,28,17,.12), rgba(6,28,17,.23));
            backdrop-filter: blur(2px);
        }

        .hero-content h1 {
            font-size: clamp(4.6rem, 9vw, 8rem);
            line-height: .92;
            margin-bottom: 20px;
            text-shadow: 0 7px 28px rgba(0,0,0,.62);
        }

        .hero-title-accent,
        .hero-home-line {
            text-shadow: 0 4px 18px rgba(0,0,0,.68);
        }

        .hero-content p {
            max-width: 690px;
            padding: 10px 16px;
            margin-bottom: 24px;
            border-radius: 16px;
            background: rgba(255,255,255,.72);
            color: #111;
            font-weight: 500;
            line-height: 1.7;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
        }

        .btn {
            min-height: 46px;
            border-radius: 16px;
            padding-inline: 28px;
        }

        .section-title {
            margin-top: clamp(44px, 6vw, 70px);
            line-height: 1.12;
        }

        .section-title::after {
            width: 74px;
            border-radius: 999px;
        }

        .features-grid,
        .terms-grid {
            gap: clamp(14px, 2vw, 24px);
        }

        .feature-card,
        .terms-card,
        .faq-item,
        .product-card {
            border-color: rgba(18,53,36,.10);
        }

        .feature-card,
        .terms-card {
            border-radius: 24px;
        }

        .products-grid {
            grid-template-columns: repeat(3, minmax(0, 285px));
            gap: 24px;
        }

        .product-card {
            border-radius: 24px;
            box-shadow: 0 14px 38px rgba(18,53,36,.11);
        }

        .product-img-container {
            height: 180px;
        }

        .product-info {
            padding: 18px;
        }

        .product-footer {
            gap: 12px;
        }

        .story-visual {
            overflow: hidden;
            border: 1px solid rgba(212,175,55,.20);
        }

        .faq-trigger {
            min-height: 66px;
        }

        .modal-window {
            border-radius: 24px;
            border: 1px solid rgba(18,53,36,.10);
        }

        @media (max-width: 1100px) {
            .nav-menu { gap: 14px; }
            .nav-menu a { font-size: .94rem; }
            .brand-logo { font-size: 1.5rem; }
            .products-grid { grid-template-columns: repeat(2, minmax(240px, 1fr)); }
        }

        @media (max-width: 768px) {
            html { scroll-padding-top: 78px; }
            .container { width: min(92%, 680px); }
            .nav-container { min-height: 68px; padding-block: 7px; }
            .brand-logo { font-size: 1.22rem; gap: 6px; }
            .brand-sukkah { width: 40px; height: 34px; flex-basis: 40px; }
            .cart-icon-btn, .hamburger { width: 40px; height: 40px; border-radius: 12px; }
            .hamburger { display: grid; }
            .nav-menu {
                top: calc(100% + 1px);
                width: calc(100% - 20px);
                right: 10px;
                padding: 12px;
                gap: 5px;
                border-radius: 0 0 20px 20px;
                background: rgba(10,40,25,.98);
                border: 1px solid rgba(255,241,184,.13);
                box-shadow: 0 18px 45px rgba(0,0,0,.24);
                backdrop-filter: blur(16px);
            }
            .nav-menu a {
                display: block;
                padding: 11px 14px;
                border-radius: 12px;
                font-size: 1rem;
            }
            .nav-menu a:hover,
            .nav-menu a.active {
                background: rgba(255,255,255,.07);
            }
            .hero {
                min-height: 620px;
                height: auto;
                padding: 104px 0 96px;
            }
            .hero-background { background-position: 58% center; }
            .hero-content {
                width: min(94%, 620px);
                padding: 24px 14px;
                border-radius: 26px;
                background: linear-gradient(180deg, rgba(5,24,15,.10), rgba(5,24,15,.22));
            }
            .hero-content h1 {
                font-size: clamp(3.15rem, 15vw, 5rem);
                line-height: .95;
                margin-bottom: 18px;
            }
            .hero-title-accent { margin-top: 8px; }
            .hero-home-line {
                margin-top: 8px;
                font-size: clamp(1.2rem, 6vw, 1.7rem);
            }
            .hero-content p {
                width: min(100%, 540px);
                font-size: 1.05rem;
                line-height: 1.65;
                padding: 10px 12px;
                margin-bottom: 18px;
            }
            .btn-group { width: 100%; }
            .btn { width: min(100%, 260px); min-height: 48px; }
            .hero::after { bottom: -118px; height: 145px; }
            .features { padding: 20px 0 54px; }
            .section-title { font-size: clamp(2rem, 9vw, 2.65rem); margin-top: 42px; }
            .section-subtitle { font-size: 1.05rem; margin-bottom: 26px; line-height: 1.6; }
            .features-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .feature-card { padding: 20px 12px; border-radius: 18px; }
            .feature-card i { width: 58px; height: 58px; font-size: 2rem; border-radius: 17px; }
            .feature-card h3 { font-size: 1.08rem; }
            .feature-card p { font-size: .92rem; line-height: 1.5; }
            #shop-section { padding: 10px 4% 62px; }
            .shop-layout { padding: 10px; border-radius: 22px; }
            .products-grid { grid-template-columns: 1fr; gap: 16px; }
            .product-card { width: min(100%, 520px); justify-self: center; border-radius: 20px; }
            .product-img-container { height: 190px; }
            .product-info { padding: 16px; }
            .product-footer { flex-wrap: wrap; }
            .story-section { padding: 56px 0; }
            .story-layout { gap: 26px; }
            .story-visual { min-height: 280px; border-radius: 24px; }
            .story-note { inset-inline: 12px; bottom: 12px; max-width: none; padding: 14px 16px; border-radius: 15px; }
            .process-step { gap: 11px; }
            .process-number { flex-basis: 36px; height: 36px; }
            .terms-highlights { padding-bottom: 52px; }
            .terms-grid { grid-template-columns: 1fr; gap: 14px; }
            .terms-card { padding: 20px 16px; }
            .faq-section { padding-bottom: 56px; }
            .faq-trigger { padding: 16px; font-size: 1.02rem; gap: 12px; }
            .faq-content { padding-inline: 16px; }
            .modal-overlay { align-items: flex-end; }
            .modal-window {
                width: 100%;
                max-width: none;
                max-height: 92dvh;
                border-radius: 24px 24px 0 0;
                padding: 24px 18px;
                transform: translateY(35px) scale(.98);
            }
            .modal-overlay.active .modal-window { transform: translateY(0) scale(1); }
            .cart-drawer-overlay { align-items: stretch; }
            .cart-drawer { border-radius: 0; max-height: 100dvh; }
            .checkout-fields-grid,
            .checkout-method-toggle { grid-template-columns: 1fr; }
            .whatsapp-float { width: 54px; height: 54px; right: 14px; bottom: 14px; font-size: 1.7rem; }
            footer { padding-top: 48px; }
        }

        @media (max-width: 520px) {
            .features-grid { grid-template-columns: 1fr 1fr; }
            .hero { min-height: 570px; padding-bottom: 82px; }
            .hero-content h1 { font-size: clamp(2.85rem, 15vw, 4.2rem); }
            .hero-title-line { letter-spacing: -.045em; }
            .hero-content p { font-size: .98rem; }
            .product-img-container { height: 165px; }
            .product-title { font-size: 1.22rem; }
            .product-desc { font-size: .9rem; }
            .product-footer > div { width: auto; }
            .quantity-selector { min-height: 38px; }
            .qty-btn { width: 34px; height: 36px; }
            .add-to-cart-btn.icon-only { width: 42px; height: 42px; }
            .cart-item { align-items: flex-start; flex-wrap: wrap; }
            .cart-item-details { min-width: calc(100% - 38px); }
            .footer-bottom { gap: 12px; }
        }

        @media (max-width: 390px) {
            .container { width: 94%; }
            .brand-word:nth-of-type(2),
            .brand-word:nth-of-type(3) { display: none; }
            .hero-content { padding-inline: 9px; }
            .hero-content h1 { font-size: 2.75rem; }
            .features-grid { grid-template-columns: 1fr; }
            .feature-card { display: grid; grid-template-columns: 54px 1fr; text-align: right; column-gap: 12px; align-items: center; }
            .feature-card i { grid-row: span 2; margin-bottom: 0; width: 52px; height: 52px; font-size: 1.75rem; }
            .feature-card h3 { margin: 0; }
            .feature-card p { margin: 0; }
            .section-title { font-size: 1.9rem; }
            .modal-window { padding-inline: 14px; }
        }
'''
              text = text.replace('</style>', css + '\n    </style>', 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/design-refresh-once.yml')
          if workflow.exists():
              workflow.unlink()
      - name: Commit refreshed design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/design-refresh-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh responsive design and darken hero"
          git push
