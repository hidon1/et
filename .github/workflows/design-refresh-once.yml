name: One-time design refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/design-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject design refresh
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(encoding='utf-8'); c=Path('.github/design-refresh.css').read_text(encoding='utf-8'); p.write_text(t if 'DESIGN-REFRESH-2026' in t else t.replace('</style>', c+'\n    </style>', 1), encoding='utf-8')"
          rm -f .github/design-refresh.css .github/workflows/design-refresh-once.yml
      - name: Commit refreshed design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh responsive design and darken hero"
          git push
