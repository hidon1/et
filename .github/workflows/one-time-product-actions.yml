name: One-time ET product actions
on:
  push:
    paths:
      - '.github/workflows/one-time-product-actions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update product card actions and details
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep all storefront imagery on 1.png.
          s = s.replace("url('2.png')", "url('1.png')")

          old_btn = '''                                <button class="add-to-cart-btn icon-only" onclick="addToCart(${p.id})" title="אישור והוספה לסל" aria-label="אישור והוספה לסל">\n                                    <i class="fa-solid fa-cart-plus"></i><span>אישור והוספה לסל</span>\n                                </button>'''
          new_btn = '''                                <button class="add-to-cart-btn icon-only" onclick="event.stopPropagation(); addToCart(${p.id})" title="הוספה לסל" aria-label="הוספה לסל">\n                                    <i class="fa-solid fa-cart-plus"></i>\n                                </button>\n                                <button class="direct-checkout-btn" onclick="event.stopPropagation(); buyNow(${p.id})">\n                                    <i class="fa-solid fa-credit-card"></i> מעבר לתשלום\n                                </button>'''
          if old_btn not in s:
              raise SystemExit('product button block not found')
          s = s.replace(old_btn, new_btn, 1)

          old_card = "                card.className = 'product-card reveal';\n                card.innerHTML = `"
          new_card = "                card.className = 'product-card reveal product-card-clickable';\n                card.setAttribute('role', 'button');\n                card.setAttribute('tabindex', '0');\n                card.setAttribute('aria-label', `פרטים נוספים על ${p.name}`);\n                card.onclick = (event) => {\n                    if (!event.target.closest('button, .quantity-selector')) openProductDetails(p.id);\n                };\n                card.onkeydown = (event) => {\n                    if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('button')) {\n                        event.preventDefault();\n                        openProductDetails(p.id);\n                    }\n                };\n                card.innerHTML = `"
          if old_card not in s:
              raise SystemExit('card assignment not found')
          s = s.replace(old_card, new_card, 1)

          css_anchor = '''        .add-to-cart-btn.icon-only {\n            width: 42px;\n            height: 42px;\n            border-radius: 50%;\n            padding: 0;\n            justify-content: center;\n            font-size: 1.05rem;\n        }'''
          css_add = css_anchor + '''\n\n        .direct-checkout-btn {\n            min-height: 42px;\n            padding: 8px 16px;\n            border: 1px solid rgba(18,53,36,.16);\n            border-radius: 999px;\n            background: linear-gradient(135deg, var(--gold), #f3db82);\n            color: var(--primary-dark);\n            font-weight: 800;\n            cursor: pointer;\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            gap: 7px;\n            transition: var(--transition-smooth);\n            box-shadow: 0 8px 20px rgba(212,175,55,.18);\n        }\n\n        .direct-checkout-btn:hover {\n            transform: translateY(-2px);\n            background: var(--primary-dark);\n            color: #fff;\n        }\n\n        .product-card-clickable { cursor: pointer; }\n        .product-card-clickable:focus-visible {\n            outline: 3px solid rgba(82,183,136,.45);\n            outline-offset: 4px;\n        }\n\n        .product-details-overlay {\n            position: fixed;\n            inset: 0;\n            z-index: 3200;\n            background: rgba(4,23,14,.72);\n            backdrop-filter: blur(8px);\n            display: grid;\n            place-items: center;\n            padding: 20px;\n        }\n\n        .product-details-window {\n            width: min(94vw, 780px);\n            max-height: 90vh;\n            overflow-y: auto;\n            position: relative;\n            border-radius: 28px;\n            padding: clamp(24px, 5vw, 42px);\n            background: linear-gradient(145deg, #fffef8, #eef8eb);\n            border: 1px solid rgba(212,175,55,.35);\n            box-shadow: 0 28px 90px rgba(0,0,0,.38);\n        }\n\n        .product-details-window::before {\n            content: '';\n            display: block;\n            height: 8px;\n            width: 108px;\n            margin: 0 auto 22px;\n            border-radius: 999px;\n            background: linear-gradient(90deg, var(--primary-dark), var(--gold), var(--primary-light));\n        }\n\n        .product-details-close {\n            position: absolute;\n            top: 16px;\n            left: 16px;\n            width: 42px;\n            height: 42px;\n            border: 0;\n            border-radius: 50%;\n            background: rgba(18,53,36,.08);\n            color: var(--primary-dark);\n            font-size: 1.2rem;\n            cursor: pointer;\n        }\n\n        .product-details-title {\n            text-align: center;\n            color: var(--primary-dark);\n            font-size: clamp(1.9rem, 5vw, 2.8rem);\n            margin-bottom: 10px;\n        }\n\n        .product-details-lead {\n            text-align: center;\n            color: #425248;\n            font-size: 1.08rem;\n            line-height: 1.8;\n            max-width: 620px;\n            margin: 0 auto 24px;\n        }\n\n        .product-details-highlights {\n            display: grid;\n            grid-template-columns: repeat(3, 1fr);\n            gap: 12px;\n            margin: 22px 0;\n        }\n\n        .product-detail-chip {\n            padding: 16px 12px;\n            border-radius: 18px;\n            text-align: center;\n            background: rgba(255,255,255,.78);\n            border: 1px solid rgba(18,53,36,.10);\n            color: var(--primary-dark);\n            font-weight: 800;\n        }\n\n        .product-detail-chip i {\n            display: block;\n            color: var(--primary-light);\n            font-size: 1.35rem;\n            margin-bottom: 7px;\n        }\n\n        .product-details-copy {\n            background: #fff;\n            border-radius: 20px;\n            padding: 20px;\n            line-height: 1.9;\n            color: #34463b;\n            border-right: 4px solid var(--gold);\n        }\n\n        .product-details-actions {\n            display: flex;\n            justify-content: center;\n            gap: 12px;\n            flex-wrap: wrap;\n            margin-top: 24px;\n        }\n\n        @media (max-width: 620px) {\n            .product-details-highlights { grid-template-columns: 1fr; }\n            .direct-checkout-btn { flex: 1 1 155px; }\n            .product-footer > div { flex-wrap: wrap; width: 100%; }\n        }'''
          if css_anchor not in s:
              raise SystemExit('css anchor not found')
          s = s.replace(css_anchor, css_add, 1)

          js_anchor = '''        function addToCart(id) {\n            const qty = parseInt(document.getElementById(`qty-${id}`).innerText);'''
          js_insert = '''        function openProductDetails(id) {\n            const p = products.find(product => product.id === id);\n            if (!p) return;\n            document.querySelector('.product-details-overlay')?.remove();\n\n            const overlay = document.createElement('div');\n            overlay.className = 'product-details-overlay';\n            overlay.onclick = (event) => { if (event.target === overlay) overlay.remove(); };\n            overlay.innerHTML = `\n                <div class="product-details-window" role="dialog" aria-modal="true" aria-label="פרטי ${p.name}">\n                    <button class="product-details-close" onclick="this.closest('.product-details-overlay').remove()" aria-label="סגירה"><i class="fa-solid fa-xmark"></i></button>\n                    <h2 class="product-details-title">${p.name}</h2>\n                    <p class="product-details-lead">סט מלא שנבחר ונבדק בקפידה, כדי לקבל את ארבעת המינים לחג בצורה נאה, מסודרת ומכובדת.</p>\n                    <div class="product-details-highlights">\n                        <div class="product-detail-chip"><i class="fa-solid fa-magnifying-glass"></i>נבחר ונבדק בקפידה</div>\n                        <div class="product-detail-chip"><i class="fa-solid fa-ribbon"></i>ארוז בסרט מעוטר ויפה</div>\n                        <div class="product-detail-chip"><i class="fa-solid fa-house"></i>אפשרות משלוח עד פתח הבית</div>\n                    </div>\n                    <div class="product-details-copy">\n                        הסט כולל אתרוג, לולב, הדסים וערבות, ונועד למי שמחפש רכישה פשוטה ונוחה בלי לוותר על מראה מכובד ועל בחירה מוקפדת. כל סט נארז בצורה מסודרת לקראת החג, עם גימור חגיגי וסרט מעוטר, כך שהוא מגיע מוכן ונעים לקבלה. ניתן לבחור איסוף עצמי, ובאזור המרכז קיימת גם אפשרות למשלוח עד פתח הבית בתוספת תשלום.\n                    </div>\n                    <div class="product-details-actions">\n                        <button class="add-to-cart-btn" onclick="addToCart(${p.id}); this.closest('.product-details-overlay').remove();"><i class="fa-solid fa-cart-plus"></i> הוספה לסל</button>\n                        <button class="direct-checkout-btn" onclick="this.closest('.product-details-overlay').remove(); buyNow(${p.id});"><i class="fa-solid fa-credit-card"></i> מעבר לתשלום</button>\n                    </div>\n                </div>`;\n            document.body.appendChild(overlay);\n        }\n\n        function buyNow(id) {\n            const qty = parseInt(document.getElementById(`qty-${id}`)?.innerText || '1');\n            const product = products.find(p => p.id === id);\n            if (!product) return;\n            cart = [{ ...product, qty }];\n            saveCart();\n            updateCartUI();\n            openCheckoutPage();\n        }\n\n'''+js_anchor
          if js_anchor not in s:
              raise SystemExit('addToCart anchor not found')
          s = s.replace(js_anchor, js_insert, 1)

          # Remove this workflow after applying so it cannot run again.
          wf = Path('.github/workflows/one-time-product-actions.yml')
          if wf.exists(): wf.unlink()
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve ET product actions and product details"
          git push origin main
