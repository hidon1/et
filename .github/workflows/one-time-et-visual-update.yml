name: One-time ET visual update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-et-visual-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update entrance colors and background source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "linear-gradient(145deg, #fbfcf8 0%, var(--sage-100) 58%, #f5f8f1 100%);",
              "linear-gradient(145deg, #f4fff1 0%, #dff3d8 52%, #eefbea 100%);"
          )

          s = s.replace(
              "linear-gradient(120deg, rgba(18,53,36,0.84), rgba(45,106,79,0.72), rgba(212,175,55,0.30), rgba(18,53,36,0.82)), url('1.png') no-repeat center center/cover;",
              "linear-gradient(120deg, rgba(35,104,66,0.60), rgba(82,183,136,0.46), rgba(180,226,168,0.26), rgba(35,104,66,0.58)), url('1.png') no-repeat center center/cover;"
          )

          s = s.replace(
              "linear-gradient(120deg, rgba(18,53,36,0.84), rgba(45,106,79,0.72), rgba(212,175,55,0.30), rgba(18,53,36,0.82)),\n                url('1.png');",
              "linear-gradient(120deg, rgba(35,104,66,0.60), rgba(82,183,136,0.46), rgba(180,226,168,0.26), rgba(35,104,66,0.58)),\n                url('1.png');"
          )

          s = s.replace(
              "linear-gradient(120deg, rgba(18,53,36,0.82), rgba(45,106,79,0.68), rgba(212,175,55,0.28), rgba(18,53,36,0.84)),\n                url('2.png');",
              "linear-gradient(120deg, rgba(35,104,66,0.58), rgba(82,183,136,0.44), rgba(180,226,168,0.24), rgba(35,104,66,0.60)),\n                url('1.png');"
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-et-visual-update.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-et-visual-update.yml
          git commit -m "Update ET entrance colors and use 1.png background"
          git push
