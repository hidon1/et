name: One-time tune ET content panels
on:
  push:
    paths:
      - '.github/workflows/one-time-tune-content-panels.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/tune-content-panels.py
      - run: rm -f .github/workflows/one-time-tune-content-panels.yml .github/scripts/tune-content-panels.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Balance ET background and opaque content panels"
          git push origin main
