name: One-time finalize ET panels and cart
on:
  push:
    paths:
      - '.github/workflows/one-time-finalize-panels-cart.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply changes
        run: python .github/scripts/finalize_panels_cart.py
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/one-time-finalize-panels-cart.yml .github/scripts/finalize_panels_cart.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Finalize ET opaque content panels and cart summary" || exit 0
          git push origin main
