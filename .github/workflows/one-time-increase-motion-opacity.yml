name: One-time increase ET background visibility
on:
  push:
    paths:
      - '.github/workflows/one-time-increase-motion-opacity.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increase background visibility
        run: python .github/scripts/increase_motion_opacity.py
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-increase-motion-opacity.yml
          rm -f .github/scripts/increase_motion_opacity.py
          git add -A
          git commit -m "Make ET persistent background much more visible"
          git push origin main
