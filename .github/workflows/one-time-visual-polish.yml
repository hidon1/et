name: One-time ET visual polish
on:
  push:
    paths:
      - '.github/workflows/one-time-visual-polish.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish background and product presentation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Product imagery should use 8.png, while the site-wide background remains 1.png.
          s = s.replace("background-image: linear-gradient(rgba(27,67,50,0.16), rgba(212,175,55,0.18)), url('1.png');", "background-image: linear-gradient(rgba(27,67,50,0.10), rgba(18,53,36,0.12)), url('8.png');")
          s = s.replace("background-image: radial-gradient(circle at 72% 28%, rgba(243,229,171,0.55), transparent 24%), linear-gradient(135deg, rgba(255,255,255,0.16), rgba(27,67,50,0.38)), url('1.png');", "background-image: radial-gradient(circle at 72% 28%, rgba(243,229,171,0.28), transparent 24%), linear-gradient(135deg, rgba(255,255,255,0.08), rgba(27,67,50,0.18)), url('8.png');")

          # Replace product details markup with one wide banner containing image + all text at once.
          old = re.compile(r'''            overlay\.innerHTML = `\n                <div class="product-details-window"[\s\S]*?\n                </div>`;''')
          new = '''            overlay.innerHTML = `
                <div class="product-details-window product-details-banner" role="dialog" aria-modal="true" aria-label="פרטי ${p.name}">
                    <button class="product-details-close" onclick="this.closest('.product-details-overlay').remove()" aria-label="סגירה"><i class="fa-solid fa-xmark"></i></button>
                    <div class="product-details-image" aria-hidden="true">
                        <img src="8.png" alt="">
                        <span class="product-details-image-badge">כשר לכתחילה</span>
                    </div>
                    <div class="product-details-content">
                        <div class="product-details-kicker">סט ארבעת המינים לחג</div>
                        <h2 class="product-details-title">${p.name}</h2>
                        <p class="product-details-lead">סט מלא שנבחר ונבדק בקפידה, עם אתרוג, לולב, הדסים וערבות — מסודר ומוכן לחג בצורה מכובדת ונוחה.</p>
                        <div class="product-details-highlights">
                            <div class="product-detail-chip"><i class="fa-solid fa-magnifying-glass"></i><span>נבחר ונבדק בקפידה</span></div>
                            <div class="product-detail-chip"><i class="fa-solid fa-ribbon"></i><span>אריזה חגיגית עם סרט מעוטר</span></div>
                            <div class="product-detail-chip"><i class="fa-solid fa-house"></i><span>אפשרות משלוח עד פתח הבית</span></div>
                        </div>
                        <div class="product-details-copy">
                            הסט מיועד למי שרוצה לקנות ארבעת המינים בצורה פשוטה ונוחה בלי לוותר על בחירה מוקפדת ועל מראה מכובד. כל סט נארז בצורה מסודרת לקראת החג, עם גימור חגיגי וסרט מעוטר. ניתן לבחור איסוף עצמי, ובאזור המרכז קיימת גם אפשרות למשלוח עד פתח הבית בתוספת תשלום.
                        </div>
                        <div class="product-details-bottom">
                            <div class="product-details-price">₪${p.price}</div>
                            <div class="product-details-actions">
                                <button class="add-to-cart-btn" onclick="addToCart(${p.id}); this.closest('.product-details-overlay').remove();"><i class="fa-solid fa-cart-plus"></i> הוספה לסל</button>
                                <button class="direct-checkout-btn" onclick="this.closest('.product-details-overlay').remove(); buyNow(${p.id});"><i class="fa-solid fa-credit-card"></i> מעבר לתשלום</button>
                            </div>
                        </div>
                    </div>
                </div>`;'''
          s, n = old.subn(new, s, count=1)
          if n != 1:
              raise SystemExit('product details markup not found')

          # Add non-destructive visual overrides at the end of the main stylesheet.
          marker = '</style>'
          polish = r'''

        /* VISUAL-POLISH-2026-09-02 */
        body {
            background:
                linear-gradient(rgba(241,251,237,.90), rgba(232,247,226,.92)),
                url('1.png') center center / cover fixed no-repeat;
        }

        body::before {
            background:
                linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.34)),
                url('1.png') center center / cover no-repeat;
            opacity: .13;
            mix-blend-mode: multiply;
        }

        section:not(.hero), .features, .story-section, .terms-highlights, .faq-section {
            background-color: rgba(247,252,244,.78) !important;
            backdrop-filter: blur(4px);
        }

        .shop-layout {
            background: rgba(255,255,255,.88);
            box-shadow: 0 24px 70px rgba(18,53,36,.14);
            border: 1px solid rgba(212,175,55,.18);
        }

        .product-card {
            overflow: hidden;
            border: 1px solid rgba(18,53,36,.10);
            box-shadow: 0 18px 45px rgba(18,53,36,.13);
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 60px rgba(18,53,36,.20);
        }

        .product-img-container {
            min-height: 245px;
            background: #edf5e8;
        }

        .product-hover-image {
            background-size: cover !important;
            background-position: center !important;
            opacity: 1 !important;
        }

        .placeholder-art { opacity: 0; }

        .product-details-overlay {
            padding: clamp(12px, 2.5vw, 28px);
        }

        .product-details-window.product-details-banner {
            width: min(96vw, 1120px);
            max-width: 1120px;
            max-height: none;
            overflow: visible;
            padding: 0;
            display: grid;
            grid-template-columns: minmax(360px, .92fr) minmax(0, 1.28fr);
            direction: ltr;
            border-radius: 32px;
            background: #fbfff8;
            border: 1px solid rgba(212,175,55,.32);
            box-shadow: 0 34px 110px rgba(0,0,0,.42);
        }

        .product-details-window.product-details-banner::before { display: none; }

        .product-details-image {
            position: relative;
            min-height: 520px;
            overflow: hidden;
            border-radius: 32px 0 0 32px;
            background: #dfeeda;
        }

        .product-details-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 58%, rgba(9,39,24,.30));
            pointer-events: none;
        }

        .product-details-image img {
            width: 100%;
            height: 100%;
            min-height: 520px;
            object-fit: cover;
            display: block;
        }

        .product-details-image-badge {
            position: absolute;
            z-index: 2;
            left: 22px;
            bottom: 22px;
            padding: 9px 15px;
            border-radius: 999px;
            background: rgba(18,53,36,.92);
            color: var(--gold-light);
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(0,0,0,.22);
        }

        .product-details-content {
            direction: rtl;
            padding: clamp(30px, 4vw, 52px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-details-kicker {
            color: var(--primary-light);
            font-size: .9rem;
            font-weight: 900;
            letter-spacing: .02em;
            margin-bottom: 5px;
        }

        .product-details-title {
            text-align: right;
            font-size: clamp(2rem, 3.7vw, 3.2rem);
            margin-bottom: 10px;
            line-height: 1.04;
        }

        .product-details-lead {
            text-align: right;
            max-width: none;
            margin: 0 0 18px;
            font-size: 1.02rem;
            line-height: 1.7;
        }

        .product-details-highlights {
            grid-template-columns: repeat(3, minmax(0,1fr));
            gap: 9px;
            margin: 12px 0 17px;
        }

        .product-detail-chip {
            padding: 12px 8px;
            border-radius: 15px;
            font-size: .86rem;
            line-height: 1.35;
            background: rgba(235,246,231,.82);
        }

        .product-detail-chip i { font-size: 1.12rem; margin-bottom: 5px; }

        .product-details-copy {
            padding: 15px 17px;
            border-radius: 16px;
            line-height: 1.72;
            font-size: .95rem;
            background: rgba(255,255,255,.72);
            border-right: 4px solid var(--gold);
            box-shadow: inset 0 0 0 1px rgba(18,53,36,.07);
        }

        .product-details-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 19px;
            padding-top: 17px;
            border-top: 1px solid rgba(18,53,36,.10);
        }

        .product-details-price {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .product-details-actions { margin-top: 0; justify-content: flex-start; }

        .product-details-close {
            z-index: 6;
            background: rgba(255,255,255,.92);
            box-shadow: 0 5px 18px rgba(0,0,0,.14);
        }

        @media (max-width: 820px) {
            body { background-attachment: scroll; }
            .product-details-window.product-details-banner {
                grid-template-columns: 1fr;
                width: min(96vw, 660px);
                max-height: 94dvh;
                overflow-y: auto;
                border-radius: 26px;
            }
            .product-details-image {
                min-height: 230px;
                height: 30vh;
                max-height: 300px;
                border-radius: 26px 26px 0 0;
            }
            .product-details-image img { min-height: 100%; }
            .product-details-content { padding: 22px 18px 24px; }
            .product-details-highlights { grid-template-columns: repeat(3, 1fr); }
            .product-detail-chip { font-size: .78rem; padding: 9px 6px; }
            .product-details-bottom { flex-wrap: wrap; }
            .product-details-actions { width: 100%; }
            .product-details-actions > button { flex: 1 1 145px; }
        }

        @media (max-width: 520px) {
            .product-details-title { font-size: 1.75rem; }
            .product-details-lead { font-size: .92rem; line-height: 1.55; }
            .product-details-copy { font-size: .86rem; line-height: 1.55; }
            .product-details-highlights { grid-template-columns: 1fr; gap: 6px; }
            .product-detail-chip { display: flex; align-items: center; gap: 8px; text-align: right; }
            .product-detail-chip i { margin: 0; }
            .product-details-price { font-size: 1.65rem; }
        }
'''
          idx = s.rfind(marker)
          if idx == -1:
              raise SystemExit('style closing tag not found')
          s = s[:idx] + polish + '\n' + s[idx:]

          # Self-delete workflow after applying.
          wf = Path('.github/workflows/one-time-visual-polish.yml')
          if wf.exists():
              wf.unlink()
          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish ET background and product banner"
          git push origin main
