name: One-time ET visual polish
on:
  push:
    paths:
      - '.github/workflows/one-time-visual-polish.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply visual polish
        run: python .github/scripts/visual_polish.py
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-visual-polish.yml
          rm -f .github/scripts/visual_polish.py
          git add -A
          git commit -m "Polish ET background and product banner"
          git push origin main
