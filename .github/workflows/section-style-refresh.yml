name: Section style refresh

on:
  push:
    paths:
      - '.github/workflows/section-style-refresh.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh section banners and headings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<h2 class="section-title">הסטים שלנו ולצידם ארבעת המינים</h2>', '<div class="section-kicker">הבחירה שלכם לחג</div><h2 class="section-title">בוחרים את הסט שמתאים לכם</h2>', 1)
          s=s.replace('<p class="section-subtitle">בחרו סט מלא באחת משלוש רמות ההידור, או הוסיפו פריטים בודדים: אתרוג, לולב והדסים.</p>', '<p class="section-subtitle">שלוש רמות הידור, לצד אתרוג, לולב והדסים בנפרד — הכול במקום אחד, ברור ונוח.</p>', 1)
          s=s.replace('<h2 class="section-title">למה לבחור בנו?</h2>', '<div class="section-kicker">קונים בראש שקט</div><h2 class="section-title">מה הופך את הבחירה לפשוטה יותר?</h2>', 1)
          s=s.replace('<p class="section-subtitle">בחירה פשוטה, איכותית ונקייה</p>', '<p class="section-subtitle">פחות התלבטות, יותר ביטחון — סחורה מוקפדת, בדיקה אישית ושירות נעים.</p>', 1)
          s=s.replace('<h2 class="section-title">מהמיון ועד לידיים שלכם</h2>', '<div class="section-kicker">מהשטח עד אליכם</div><h2 class="section-title">כך זה עובד, שלב אחרי שלב</h2>', 1)
          s=s.replace('<h2 class="section-title">התנאים שלנו</h2>', '<div class="section-kicker">בלי אותיות קטנות</div><h2 class="section-title">כל מה שחשוב לדעת לפני שמזמינים</h2>', 1)
          s=s.replace('<h2 class="section-title">שאלות נפוצות</h2>', '<div class="section-kicker">לפני שמחליטים</div><h2 class="section-title">שאלות שאנשים באמת שואלים</h2>', 1)

          css = r'''

        /* רענון שפה ויזואלית לכותרות ולבאנרים */
        .section-kicker {
            width: fit-content;
            margin: 58px auto 10px;
            padding: 7px 15px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(18,53,36,0.95), rgba(45,106,79,0.9));
            color: #fff1b8;
            font-size: 0.84rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            box-shadow: 0 8px 22px rgba(18,53,36,0.14);
        }

        .section-title {
            width: fit-content;
            max-width: min(94%, 980px);
            margin: 0 auto 10px;
            padding: 13px 28px 16px;
            font-family: 'Frank Ruhl Libre', 'Tinos', serif;
            font-size: clamp(2.55rem, 5.2vw, 4.35rem);
            line-height: 1.02;
            font-weight: 900;
            letter-spacing: -0.035em;
            color: #173e2b;
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,248,229,0.88));
            border: 1px solid rgba(212,175,55,0.28);
            border-radius: 24px 8px 24px 8px;
            box-shadow: 0 18px 42px rgba(18,53,36,0.10);
            position: relative;
            isolation: isolate;
        }

        .section-title::before {
            content: '';
            position: absolute;
            inset: 7px -10px -7px 10px;
            border-radius: 24px 8px 24px 8px;
            background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(45,106,79,0.08));
            z-index: -1;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 86px;
            height: 4px;
            margin: 12px auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--gold), var(--primary-light));
        }

        .section-subtitle {
            max-width: 820px;
            margin: 0 auto 34px;
            padding: 0 18px;
            font-size: 1.17rem;
            line-height: 1.8;
            color: #53645b;
            font-weight: 500;
        }

        #shop-section {
            padding-top: 18px;
            padding-bottom: 24px;
        }

        #shop-section > .section-title,
        #shop-section > .section-subtitle,
        #shop-section > .section-kicker {
            position: relative;
            z-index: 2;
        }

        #shop-section::before {
            content: '';
            display: block;
            position: absolute;
            inset-inline: 4%;
            height: 250px;
            margin-top: 18px;
            border-radius: 34px;
            background:
                radial-gradient(circle at 14% 28%, rgba(212,175,55,0.22), transparent 22%),
                linear-gradient(135deg, rgba(18,53,36,0.08), rgba(255,255,255,0.6));
            pointer-events: none;
        }

        .catalog-tabs {
            position: relative;
            z-index: 3;
            gap: 10px;
            margin-top: 10px;
        }

        .catalog-tab {
            border: 1px solid rgba(18,53,36,0.16);
            background: rgba(255,255,255,0.92);
            padding: 11px 22px;
            font-weight: 800;
            box-shadow: 0 10px 24px rgba(18,53,36,0.08);
        }

        .features,
        .story-section,
        .terms-highlights,
        .faq-section {
            position: relative;
            overflow: hidden;
        }

        .features::after,
        .terms-highlights::after,
        .faq-section::after {
            content: '❧';
            position: absolute;
            inset-inline-start: 3%;
            top: 26px;
            font-size: clamp(5rem, 10vw, 9rem);
            color: rgba(45,106,79,0.055);
            transform: rotate(-12deg);
            pointer-events: none;
        }

        .feature-card,
        .terms-card,
        .faq-item {
            border: 1px solid rgba(212,175,55,0.18);
            box-shadow: 0 16px 34px rgba(18,53,36,0.09);
        }

        .feature-card h3,
        .terms-card h3,
        .process-step h3 {
            font-family: 'Frank Ruhl Libre', 'Tinos', serif;
            font-weight: 800;
            letter-spacing: -0.015em;
        }

        @media (max-width: 768px) {
            .section-kicker { margin-top: 40px; }
            .section-title { padding: 12px 18px 14px; border-radius: 18px 6px 18px 6px; }
            .section-title::before { inset: 5px -6px -5px 6px; }
            #shop-section::before { inset-inline: 2%; height: 220px; }
        }
'''
          s=s.replace('</style>', css + '\n    </style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh section banners and typography"
          git push
