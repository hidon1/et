name: Hero typography update

on:
  push:
    paths:
      - '.github/workflows/hero-typography.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero typography and tagline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("family=Tinos:ital,wght@0,400;0,700;1,400&display=swap", "family=Frank+Ruhl+Libre:wght@400;600;700;900&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap", 1)
          s=s.replace("        .hero-title-line { display: block; }", "        .hero-title-line { display: block; font-family: 'Frank Ruhl Libre', 'Tinos', serif; font-weight: 900; letter-spacing: -0.035em; }", 1)
          s=s.replace("            font-style: italic;\n            color: #fff7d6;", "            font-family: 'Frank Ruhl Libre', 'Tinos', serif;\n            font-weight: 600;\n            font-style: normal;\n            letter-spacing: 0.01em;\n            color: #fff7d6;", 1)
          s=s.replace("        .hero-content p {", "        .hero-home-line {\n            display: block;\n            margin-top: 10px;\n            font-family: 'Frank Ruhl Libre', 'Tinos', serif;\n            font-size: clamp(1.45rem, 3vw, 2.25rem);\n            font-weight: 700;\n            color: #fff7d6;\n            letter-spacing: 0.01em;\n            text-shadow: 0 3px 14px rgba(0,0,0,0.4);\n        }\n\n        .hero-content p {", 1)
          s=s.replace('<h1><span class="hero-title-line">שוק ארבעת המינים</span><span class="hero-title-accent">כמו שבאמת רציתם.</span></h1>', '<h1><span class="hero-title-line">שוק ארבעת המינים</span><span class="hero-title-accent">כמו שבאמת רציתם.</span><span class="hero-home-line">מעכשיו קונים מהבית</span></h1>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Style hero headline and add home-shopping tagline"
          git push
