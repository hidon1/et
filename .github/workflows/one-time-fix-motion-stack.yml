name: One-time fix ET motion stacking
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-motion-stack.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply stacking fix
        run: python .github/scripts/fix_motion_stack.py
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fix-motion-stack.yml
          rm -f .github/scripts/fix_motion_stack.py
          git add -A
          git commit -m "Fix ET persistent background stacking"
          git push origin main
