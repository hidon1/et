name: One-time ET story and cart cleanup
on:
  push:
    paths:
      - '.github/workflows/one-time-story-cart-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply cleanup
        run: python .github/scripts/refine_story_remove_float.py
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/one-time-story-cart-cleanup.yml .github/scripts/refine_story_remove_float.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine ET story section and keep only upper cart" || exit 0
          git push origin main
