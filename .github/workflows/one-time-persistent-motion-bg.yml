name: One-time persistent motion background
on:
  push:
    paths:
      - '.github/workflows/one-time-persistent-motion-bg.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply persistent hero motion
        run: python .github/scripts/persistent_motion.py
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-persistent-motion-bg.yml
          rm -f .github/scripts/persistent_motion.py
          git add -A
          git commit -m "Keep ET hero motion visible while scrolling"
          git push origin main
