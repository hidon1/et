name: Update Spanish set copy

on:
  push:
    paths:
      - '.github/workflows/update-spanish-set-copy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine storefront wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('app.js'), Path('arbaat-haminim.html')]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')

              # Keep pickup location general.
              for old in [
                  'מיד בנימין, רחוב עגור 9, בתיאום מראש',
                  'ביד בנימין, רחוב עגור 9, בתיאום מראש',
                  'יד בנימין, רחוב עגור 9, בתיאום מראש',
                  'יד בנימין, עגור 9 (בתיאום מראש)',
                  'רחוב עגור 9, יד בנימין',
                  'רחוב עגור 9',
                  'עגור 9'
              ]:
                  s = s.replace(old, 'יד בנימין, בתיאום מראש')
              s = s.replace('האיסוף מתבצע ביד בנימין, בתיאום מראש, בתיאום מראש', 'האיסוף מתבצע ביד בנימין, בתיאום מראש')
              s = s.replace('מיד בנימין, בתיאום מראש, בתיאום מראש', 'מיד בנימין, בתיאום מראש')

              # More elegant Sephardic wording instead of plain "סט ספרדי".
              replacements = {
                  'סט ארבעת המינים ספרדי מהודר א׳ א׳': 'סט ארבעת המינים מהודר א׳ א׳ לפי נוסח הספרדים',
                  'סט ארבעת המינים ספרדי ברמה גבוהה': 'סט ארבעת המינים ברמה גבוהה לפי נוסח הספרדים',
                  'סט ארבעת המינים ספרדי לחג': 'סט ארבעת המינים מהודר לפי נוסח הספרדים',
                  'סט ספרדי מלא הכולל': 'סט מהודר א׳ א׳ לפי נוסח הספרדים, הכולל',
                  'סט ספרדי מלא ומכובד לחג': 'סט מהודר ומכובד לחג לפי נוסח הספרדים',
                  'סט ספרדי מלא שנבחר ונבדק בקפידה': 'סט מהודר א׳ א׳ לפי נוסח הספרדים, שנבחר ונבדק בקפידה',
                  'סט ספרדי מלא ב־130 ₪': 'סט מהודר א׳ א׳ לפי נוסח הספרדים ב־130 ₪',
                  '130 ₪ · סט ספרדי · מהודר א׳ א׳': '130 ₪ · מהודר א׳ א׳ · לפי נוסח הספרדים',
                  'בחירה מוקפדת של סטים ספרדיים מהודרים': 'בחירה מוקפדת של ארבעת המינים מהודרים א׳ א׳ לפי נוסח הספרדים',
                  '<h3>סט ספרדי ברמה גבוהה</h3>': '<h3>מהודר א׳ א׳ לפי נוסח הספרדים</h3>',
                  "name: 'סט ארבעת המינים ספרדי מהודר א׳ א׳'": "name: 'סט ארבעת המינים מהודר א׳ א׳ לפי נוסח הספרדים'",
                  "variety: 'סט ספרדי'": "variety: 'לפי נוסח הספרדים'",
                  'סט ספרדי מלא': 'סט מהודר לפי נוסח הספרדים',
                  'סט ספרדי': 'לפי נוסח הספרדים',
              }
              for old, new in replacements.items():
                  s = s.replace(old, new)

              # Cleanup duplicates caused by earlier rounds.
              s = s.replace('לפי נוסח הספרדים לפי נוסח הספרדים', 'לפי נוסח הספרדים')
              s = s.replace('מהודר א׳ א׳ מהודר א׳ א׳', 'מהודר א׳ א׳')
              s = s.replace('יד בנימין, בתיאום מראש, בתיאום מראש', 'יד בנימין, בתיאום מראש')

              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit storefront changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js arbaat-haminim.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine Sephardic wording across storefront"
          git push
