name: One-time real ET layer and cart fix
on:
  push:
    paths:
      - '.github/workflows/one-time-real-layer-cart-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply real layer and cart fix
        run: python .github/scripts/fix_real_layers_and_cart.py
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/one-time-real-layer-cart-fix.yml .github/scripts/fix_real_layers_and_cart.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Fix ET content stacking and restore clear cart access" || exit 0
          git push origin main
